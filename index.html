<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Suplementação — Acesso</title>
  <style>
    :root {
      --ink: #12203a;
      --paper: #f3f1ea;
      --card: #fff;
      --line: #dcd8cb;
      --ok: #2f7a52;
      --muted: #6b7280;
      --err: #b23b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
      color: var(--ink);
      text-align: center;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0 0 20px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px 20px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 14px;
    }
    .success {
      color: var(--ok);
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0 0 16px;
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 12px 0 0;
      min-height: 1.35em;
      text-align: center;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .diag dl {
      margin: 0;
      font-size: 0.9rem;
    }
    .diag dt {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-top: 10px;
    }
    .diag dt:first-child { margin-top: 0; }
    .diag dd {
      margin: 2px 0 0;
      word-break: break-all;
    }
    .diag img.avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin-top: 4px;
      border: 1px solid var(--line);
    }
    .btn-reset {
      margin-top: 16px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
    }
    .btn-reset:hover { background: #f9f7f2; }
    #signin-area {
      min-height: 44px;
      display: flex;
      justify-content: center;
    }
    .hidden { display: none !important; }
    .footnote {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
      text-align: center;
    }
    .config-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .config-note code {
      font-size: 0.75rem;
      background: #f0ede4;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Controle de Suplementação</h1>
    <p class="subtitle">Acesso ao sistema</p>

    <div class="card" id="card-signin">
      <div id="signin-area"></div>
      <p class="status" id="status-line"></p>
      <p class="config-note hidden" id="config-note">
        Configure no script: <code>GOOGLE_CLIENT_ID</code> e
        <code>GAS_WEB_APP_URL</code> (URL /exec da implantação).
      </p>
    </div>

    <div class="card hidden" id="card-result">
      <p class="success" id="msg-success"></p>
      <h2></h2>
      <div class="diag" id="diag-fields"></div>
      <button type="button" class="btn-reset" id="btn-reset">
        Sair / Testar outra conta
      </button>
    </div>

    <p class="footnote">
      Utilize sua conta Google autorizada para acessar.
    </p>
  </div>

  <!-- Form POST top-level → Apps Script doPost (evita CORS do fetch). -->
  <form id="handoff-form" method="POST" action="" target="_top" accept-charset="UTF-8" class="hidden">
    <input type="hidden" name="id_token" id="handoff-id-token" value="">
  </form>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    /* ===================================================================
       M7.2d — GitHub Pages → GIS → form POST → GAS
       Client ID Web (público):
       https://console.cloud.google.com/apis/credentials
       =================================================================== */
    var GOOGLE_CLIENT_ID = '554666690300-kn5di3i37h8d4ddu9ibk6mtmhaspv6ti.apps.googleusercontent.com';

    /* Cole a URL /exec da implantação (Execute as Me + Anyone). */
    var GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxmjkpgqsYqb9BF2nmqxpmu9MtnMMNIf7YAE7IoPJMwDTvTYuptC0tQtcBh2pHDw3tF/exec';

    var DEV_MODE = /[?&]dev=1(?:&|$)/.test(window.location.search);

    var cardSignin = document.getElementById('card-signin');
    var cardResult = document.getElementById('card-result');
    var signinArea = document.getElementById('signin-area');
    var statusLine = document.getElementById('status-line');
    var diagFields = document.getElementById('diag-fields');
    var btnReset = document.getElementById('btn-reset');
    var configNote = document.getElementById('config-note');
    var handoffForm = document.getElementById('handoff-form');
    var handoffToken = document.getElementById('handoff-id-token');
    var isHandingOff = false;

    function setStatus_(msg, kind) {
      statusLine.textContent = msg || '';
      statusLine.className = 'status' + (kind ? ' ' + kind : '');
    }

    /**
     * Inválida se vazia, placeholder (COLE_AQUI) ou não for URL /exec do GAS.
     * Válida: https://script.google.com/macros/s/.../exec
     */
    function isGasWebAppUrlInvalid_() {
      if (!GAS_WEB_APP_URL || typeof GAS_WEB_APP_URL !== 'string') return true;
      var url = GAS_WEB_APP_URL.replace(/^\s+|\s+$/g, '');
      if (!url || url.indexOf('COLE_AQUI') !== -1) return true;
      return !/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec\/?$/.test(url);
    }

    function syncConfigNote_() {
      if (!configNote) return;
      var needsClientId = GOOGLE_CLIENT_ID.indexOf('SEU_GOOGLE_CLIENT_ID') !== -1;
      if (needsClientId || isGasWebAppUrlInvalid_()) {
        configNote.classList.remove('hidden');
      } else {
        configNote.classList.add('hidden');
      }
    }

    syncConfigNote_();

    /**
     * Decodifica payload JWT apenas para exibição local em ?dev=1 (NÃO é verificação).
     * @param {string} credential ID token
     * @return {Object|null}
     */
    function decodeJwtPayloadForDisplay_(credential) {
      if (!credential || typeof credential !== 'string') return null;
      var parts = credential.split('.');
      if (parts.length !== 3) return null;
      try {
        var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        return JSON.parse(atob(b64));
      } catch (e) {
        return null;
      }
    }

    function formatExp_(exp) {
      if (exp == null || exp === '') return '—';
      var n = Number(exp);
      if (!isFinite(n)) return String(exp);
      try {
        return new Date(n * 1000).toISOString() + ' (' + n + ')';
      } catch (e2) {
        return String(exp);
      }
    }

    function appendDiagRow_(label, value) {
      var dt = document.createElement('dt');
      dt.textContent = label;
      var dd = document.createElement('dd');
      if (value && value.nodeType === 1) {
        dd.appendChild(value);
      } else {
        dd.textContent = value == null || value === '' ? '—' : String(value);
      }
      diagFields.appendChild(dt);
      diagFields.appendChild(dd);
    }

    function showDiagnostic_(payload) {
      diagFields.innerHTML = '';
      if (!payload) {
        appendDiagRow_('Erro', 'Não foi possível decodificar o payload para exibição.');
        return;
      }
      appendDiagRow_('sub', payload.sub);
      appendDiagRow_('email', payload.email);
      appendDiagRow_('email_verified', payload.email_verified);
      appendDiagRow_('name', payload.name);
      if (payload.picture) {
        var img = document.createElement('img');
        img.className = 'avatar';
        img.src = payload.picture;
        img.alt = 'Foto do perfil Google';
        img.width = 48;
        img.height = 48;
        appendDiagRow_('picture', img);
      }
      appendDiagRow_('aud', payload.aud);
      appendDiagRow_('iss', payload.iss);
      appendDiagRow_('exp', formatExp_(payload.exp));
    }

    function startHandoff_(credential) {
      if (isHandingOff) return;
      if (!credential) {
        setStatus_('Credential ausente.', 'err');
        return;
      }
      if (isGasWebAppUrlInvalid_()) {
        setStatus_('Configure GAS_WEB_APP_URL no script desta página (URL /exec).', 'err');
        syncConfigNote_();
        return;
      }
      if (DEV_MODE) {
        showDiagnostic_(decodeJwtPayloadForDisplay_(credential));
        cardResult.classList.remove('hidden');
      } else {
        cardResult.classList.add('hidden');
        diagFields.innerHTML = '';
      }
      isHandingOff = true;
      setStatus_('Autenticando com segurança...', 'ok');
      handoffForm.action = GAS_WEB_APP_URL;
      handoffToken.value = credential;
      // Navegação top-level: JWT vai no corpo POST, não na query string.
      handoffForm.submit();
    }

    function handleCredentialResponse_(response) {
      if (!response || !response.credential) {
        setStatus_('Login Google sem credential.', 'err');
        return;
      }
      // Não persistir, não logar e não colocar JWT na URL.
      startHandoff_(response.credential);
    }

    function initGoogleSignIn_() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        setStatus_('Carregando Google Identity Services…');
        setTimeout(initGoogleSignIn_, 100);
        return;
      }
      if (GOOGLE_CLIENT_ID.indexOf('SEU_GOOGLE_CLIENT_ID') !== -1) {
        syncConfigNote_();
        signinArea.innerHTML = '';
        setStatus_('Configure GOOGLE_CLIENT_ID no script desta página.', 'err');
        return;
      }
      syncConfigNote_();
      signinArea.innerHTML = '';
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse_,
        auto_select: false,
        cancel_on_tap_outside: true
      });
      google.accounts.id.renderButton(signinArea, {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        locale: 'pt-BR'
      });
      setStatus_('');
    }

    function resetLocalState_() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
      isHandingOff = false;
      handoffToken.value = '';
      handoffForm.action = '';
      diagFields.innerHTML = '';
      cardResult.classList.add('hidden');
      cardSignin.classList.remove('hidden');
      signinArea.innerHTML = '';
      setStatus_('');
      initGoogleSignIn_();
    }

    btnReset.addEventListener('click', resetLocalState_);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleSignIn_);
    } else {
      initGoogleSignIn_();
    }
  </script>
</body>
</html>
